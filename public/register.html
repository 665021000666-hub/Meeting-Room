<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>สมัครสมาชิก | ระบบจองห้องประชุม</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card">
      <h2>สมัครสมาชิก</h2>
      <p>สร้างบัญชีผู้ใช้ (สิทธิ์ผู้ใช้ทั่วไป)</p>

      <label>ชื่อผู้ใช้</label>
      <input id="username" type="text" placeholder="Username" required>

      <label>รหัสผ่าน</label>
      <input id="password" type="password" placeholder="อย่างน้อย 6 ตัว" required>

      <button id="regBtn" class="btn btn-primary">สมัครสมาชิก</button>
      <p style="margin-top:10px"><a href="login.html">กลับไปหน้าเข้าสู่ระบบ</a></p>
    </div>
  </div>

  <script>
    document.getElementById("regBtn").addEventListener("click", async ()=>{
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      if(!username || !password) return alert("กรุณากรอกข้อมูลให้ครบ");
      if(password.length < 6) return alert("รหัสผ่านอย่างน้อย 6 ตัว");

      try{
        const res = await fetch("/api/register", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if(!res.ok) return alert(data.message || "สมัครสมาชิกไม่สำเร็จ");

        alert("สมัครสมาชิกสำเร็จ! โปรดเข้าสู่ระบบ");
        window.location.href = "login.html";
      }catch(e){ console.error(e); alert("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้"); }
    });
  </script>
</body>
</html>
